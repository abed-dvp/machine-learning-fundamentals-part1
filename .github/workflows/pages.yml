name: Publish Machine Learning Codelab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build site and bundle the Python runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/codelab/vendor/pyodide
          cp index.html .nojekyll _site/
          cp -R codelab/. _site/codelab/

          PYODIDE_BASE="https://cdn.jsdelivr.net/pyodide/v314.0.7/full"
          files=(
            "pyodide.js"
            "pyodide.mjs"
            "pyodide.asm.mjs"
            "pyodide.asm.wasm"
            "pyodide-lock.json"
            "python_stdlib.zip"
          )
          for file in "${files[@]}"; do
            echo "Bundling: ${file}"
            curl --fail --location --retry 3 --retry-delay 3 \
              "${PYODIDE_BASE}/${file}" \
              --output "_site/codelab/vendor/pyodide/${file}"
            test -s "_site/codelab/vendor/pyodide/${file}"
          done

          test -f _site/index.html
          test -f _site/codelab/index.html
          test -f _site/codelab/app.js
          test -f _site/codelab/steps.js
          echo "Website and local Python runtime prepared."

      - name: Publish to gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Codelab from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
