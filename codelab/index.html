<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Abed Codelab: interactive Python-first course from three Machine Learning Fundamentals lecture decks.">
  <title>Abed Codelab — Machine Learning Fundamentals · Part 1</title>
  <link rel="stylesheet" href="./styles.css?v=20261101-inlines">
</head>
<body>
  <header class="topbar">
    <button class="menu-button" id="menuButton" aria-label="Open navigation">☰</button>
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <strong>Abed Codelab</strong>
        <span>Machine Learning Fundamentals · Part 1</span>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="https://github.com/abed-dvp/machine-learning-fundamentals-part1#readme" class="ghost-link" target="_blank">README</a>
      <a href="https://github.com/abed-dvp/machine-learning-fundamentals-part1/blob/main/STUDY_GUIDE.md" class="ghost-link" target="_blank">Study Guide</a>
      <button id="themeButton" class="icon-button" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="progress-shell" aria-label="Course progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <p class="eyebrow">18 STEPS · 3 LECTURES</p>
        <h2>Python for AI</h2>
        <p id="progressText">0 of 18 complete</p>
      </div>
      <nav id="stepNav" class="step-nav" aria-label="Codelab steps"></nav>
      <div class="sidebar-footer">
        <button id="resetProgress" class="text-button">Reset progress</button>
      </div>
    </aside>

    <main class="main">
      <article class="lesson-card">
        <div class="lesson-meta">
          <span id="stepNumber" class="step-pill"></span>
          <span id="videoTime" class="time-link"></span>
        </div>

        <h1 id="lessonTitle"></h1>
        <p id="lessonIntro" class="lead"></p>

        <p class="runtime-note" id="runtimeText" role="status">Python loads on first run</p>
        <section class="activity-list" id="activityList" aria-label="Individual lessons with matching exercises"></section>

        <section class="takeaway">
          <p class="eyebrow">KEY TAKEAWAY</p>
          <p id="takeawayText"></p>
        </section>

        <div class="lesson-footer">
          <button id="prevButton" class="secondary-button">← Previous</button>
          <span id="completeButton" class="complete-status">0 / 0 activities complete</span>
          <button id="nextButton" class="primary-button">Next →</button>
        </div>
      </article>
    </main>
  </div>

  <script src="./steps.js?v=20261101-inlines"></script>
  <script src="./activities.js?v=20261101-inlines"></script>
  <script src="./app.js?v=20261101-inlines2"></script>
</body>
</html>
